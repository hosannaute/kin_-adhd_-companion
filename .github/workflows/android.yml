name: Android debug APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install verified Android SDK tools
        run: bash scripts/setup-ci-sdk.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Report unit test results
        if: always()
        run: python3 scripts/report-test-failures.py app/build/test-results/testDebugUnitTest
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/
          if-no-files-found: warn
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KIN-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install verified Android SDK tools
        run: bash scripts/setup-ci-sdk.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start virtual audio output for notification playback tests
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio
          pulseaudio --check || pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=kin_ci
          pactl set-default-sink kin_ci
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          avd-name: kin-ci
          pre-emulator-launch-script: python3 scripts/configure-emulator-audio.py
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -audio pa
          script: |
            kin_device_provisioned="$(adb shell settings get global device_provisioned)"
            printf '::notice title=Emulator setup::device_provisioned before tests=%s\n' "$kin_device_provisioned"
            adb shell settings put global device_provisioned 1
            adb shell settings put secure user_setup_complete 1
            ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Report device test results
        if: always()
        run: python3 scripts/report-test-failures.py app/build/outputs/androidTest-results/connected
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-results-api-${{ matrix.api-level }}
          path: app/build/reports/androidTests/
          if-no-files-found: warn
